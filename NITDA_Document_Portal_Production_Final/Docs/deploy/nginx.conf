server { listen 443 ssl http2; server_name portal.example.gov.ng; client_max_body_size 10m; add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always; location / { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; } }
